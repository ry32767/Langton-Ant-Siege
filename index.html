<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Langton Ant Siege</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="src/tokens.css" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 1. 開始画面 -->
    <section id="screen-start" class="screen">
      <div class="start-panel">
        <h1 class="display-title">Langton Ant Siege</h1>
        <p class="lead">
          ラングトンのアリが敷く「ハイウェイ」を弾道として撃ち合う、リアルタイム攻城ゲーム。<br />
          自陣の配置可能帯からテンプレートを発射し、敵の配置可能帯に届けば得点。妨害アリで敵の弾道を壊して防御する。
        </p>
        <div class="start-buttons">
          <button id="btn-pvc" class="btn btn-primary" disabled>プレイヤー vs CPU</button>
          <button id="btn-cvc" class="btn btn-secondary" disabled>CPU vs CPU</button>
        </div>
        <p id="load-status" class="load-status" role="status" aria-live="polite">データを読み込んでいます…</p>
        <p id="load-error" class="error hidden" role="alert"></p>
      </div>
    </section>

    <!-- 2. 対戦画面 -->
    <section id="screen-match" class="screen hidden">
      <div class="hud">
        <div class="hud-side hud-side1">
          <div class="hud-row hud-row-main">
            <span class="hud-label" id="label-side1">あなた</span>
            <span class="pips" id="pips1" aria-hidden="true">
              <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
            </span>
            <span class="hud-figure">得点<span id="score1" class="num">0</span>/5</span>
          </div>
          <div class="hud-row hud-row-sub">
            <span class="token-bar" id="token-bar1" aria-hidden="true"><div class="token-bar-fill" id="token-bar1-fill"></div></span>
            <span class="hud-figure">T<span id="tokens1" class="num">0</span>/<span id="tokens1-cap" class="num"></span></span>
            <span class="flying-pips" id="flying-pips1" aria-hidden="true">
              <span class="flying-pip side1-slot0"></span><span class="flying-pip side1-slot1"></span><span class="flying-pip side1-slot2"></span><span class="flying-pip side1-slot3"></span>
            </span>
            <span class="hud-figure">飛<span id="flying1" class="num">0</span>/<span id="flying1-cap" class="num"></span></span>
          </div>
        </div>
        <div class="hud-center">
          <div class="hud-time">残り <span id="time-left" class="num">--</span> 秒</div>
        </div>
        <div class="hud-side hud-side2">
          <div class="hud-row hud-row-main">
            <span class="hud-figure">得点<span id="score2" class="num">0</span>/5</span>
            <span class="pips" id="pips2" aria-hidden="true">
              <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
            </span>
            <span class="hud-label" id="label-side2">CPU</span>
          </div>
          <div class="hud-row hud-row-sub">
            <span class="hud-figure">飛<span id="flying2" class="num">0</span>/<span id="flying2-cap" class="num"></span></span>
            <span class="flying-pips" id="flying-pips2" aria-hidden="true">
              <span class="flying-pip side2-slot0"></span><span class="flying-pip side2-slot1"></span><span class="flying-pip side2-slot2"></span><span class="flying-pip side2-slot3"></span>
            </span>
            <span class="hud-figure">T<span id="tokens2" class="num">0</span>/<span id="tokens2-cap" class="num"></span></span>
            <span class="token-bar" id="token-bar2" aria-hidden="true"><div class="token-bar-fill" id="token-bar2-fill"></div></span>
          </div>
        </div>
      </div>

      <div class="match-layout">
        <div class="board-column">
          <div class="battle-area">
            <canvas id="board" tabindex="0" role="img" aria-label="盤面(256列×256行、上が自陣、下が敵陣、中央192列が得点ゲート・左右32列ずつは壁)。テンプレート選択中はクリックまたは矢印キー(Shiftで16列)で発射列を選べます"></canvas>
            <div id="result-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="result-title">
              <div class="overlay-panel">
                <h2 id="result-title">-</h2>
                <p id="result-detail"></p>
                <button id="btn-restart" class="btn btn-primary">もう一度対戦する</button>
                <button id="btn-back-title" class="btn btn-secondary">タイトルに戻る</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 操作UI: 盤面の端に置いたハンドル列 + 開く区画。一度に見せる区画は1つだけ。
             区画は盤面の外側(広幅=右、狭幅=下)に開く。盤面へは重ねない(不変条件2)。 -->
        <div class="control-panel" id="control-panel">
          <div class="panel-handles" id="panel-handles" role="tablist" aria-label="操作パネルの区画切替">
            <button data-tab="attack" class="tab panel-handle" role="tab" aria-selected="true">攻撃</button>
            <button data-tab="disrupt" class="tab panel-handle" role="tab" aria-selected="false">妨害</button>
            <button data-panel="threat" class="panel-handle" role="tab" aria-selected="false">脅威</button>
            <button data-panel="self" class="panel-handle" role="tab" aria-selected="false">自軍</button>
            <button data-panel="legend" class="panel-handle" role="tab" aria-selected="false">凡例</button>
            <!-- 非表示トグル。開いている区画を閉じて盤面だけにする / 直前の区画を open し直す。
                 開いているハンドルを再度押しても閉じられるが、それは見ただけでは分からないので
                 明示的な出口を1つ置く。 -->
            <button id="btn-panel-toggle" class="panel-handle panel-handle--toggle" type="button"
                    aria-expanded="false" aria-controls="panel-sections">表示</button>
          </div>

          <div class="panel-sections" id="panel-sections">
            <div class="panel-section hidden" id="panel-template" role="tabpanel">
              <div id="template-list" class="template-list"></div>
              <div class="launch-panel" id="launch-panel">
                <div class="hud-row">発射列 x=<span id="launch-x" class="num">-</span></div>
                <div class="hud-row">予測到達列 x=<span id="launch-entry" class="num">-</span></div>
                <p id="launch-gate-warning" class="fire-reason" role="status" aria-live="polite"></p>
              </div>
              <div class="fire-row fire-row--main">
                <button id="btn-fire" class="btn btn-primary" disabled>発射</button>
                <span id="fire-reason" class="fire-reason" role="status" aria-live="polite"></span>
              </div>
            </div>

            <div class="panel-section hidden" id="panel-threat" role="tabpanel">
              <h3>飛来中の敵の攻撃</h3>
              <div id="threat-items" class="threat-items"></div>
              <div id="threat-detail" class="threat-detail"></div>
            </div>

            <div class="panel-section hidden" id="panel-self" role="tabpanel">
              <h3>飛行中の自分のアリ</h3>
              <div id="self-destruct-items" class="threat-items"></div>
              <div class="fire-row">
                <button id="btn-self-destruct" class="btn btn-secondary" disabled>自爆</button>
                <span id="self-destruct-reason" class="fire-reason" role="status" aria-live="polite"></span>
              </div>
            </div>

            <div class="panel-section hidden" id="panel-legend" role="tabpanel">
              <div class="board-legend">
                <span class="legend-item">
                  寒色＝あなた
                  <span class="swatch swatch--side1-slot0" aria-hidden="true"></span>
                  <span class="swatch swatch--side1-slot1" aria-hidden="true"></span>
                  <span class="swatch swatch--side1-slot2" aria-hidden="true"></span>
                  <span class="swatch swatch--side1-slot3" aria-hidden="true"></span>
                </span>
                <span class="legend-item">
                  暖色＝敵
                  <span class="swatch swatch--side2-slot0" aria-hidden="true"></span>
                  <span class="swatch swatch--side2-slot1" aria-hidden="true"></span>
                  <span class="swatch swatch--side2-slot2" aria-hidden="true"></span>
                  <span class="swatch swatch--side2-slot3" aria-hidden="true"></span>
                </span>
                <span class="legend-item"><span class="legend-glyph" aria-hidden="true">▲</span>攻撃</span>
                <span class="legend-item"><span class="legend-glyph" aria-hidden="true">○</span>妨害</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
